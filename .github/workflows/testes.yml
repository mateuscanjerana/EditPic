name: Testes do EditPic
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar regras de imagem
        run: node --test tests/*.test.cjs
